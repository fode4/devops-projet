name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Vérifier la version de Python
        run: python --version

      - name: Construire l'image Docker
        run: docker build -t fode4/devops-app:latest .

      - name: Se connecter à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publier l'image sur Docker Hub
        run: docker push fode4/devops-app:latest

      - name: Installer kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Vérifier les fichiers Kubernetes
        run: |
          kubectl apply --dry-run=client -f deployment.yaml
          kubectl apply --dry-run=client -f service.yaml